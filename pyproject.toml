[project]
name = "news-feed"
version = "0.1.0"
description = "For You style tech-news feed pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
